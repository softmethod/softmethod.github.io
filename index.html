<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>softmethod</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #080808;
            --card: #111318;
            --card-hover: #191c24;
            --accent: #b01030;
            --accent-glow: rgba(176, 16, 48, 0.25);
            --accent-dim: #6a0018;
            --text: #eeeef0;
            --soft: #b8b8c4;
            --muted: #68687a;
            --border: rgba(255, 255, 255, 0.04);
            --radius: 20px;
            --shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.8);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 32px 20px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(176, 16, 48, 0.06), transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(106, 0, 24, 0.08), transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(176, 16, 48, 0.04), transparent 50%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            opacity: 0.5;
            z-index: -1;
            pointer-events: none;
        }

        /* ОВЕРЛЕЙ */
        #overlay {
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: rgba(8, 8, 8, 0.92);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #overlay .content {
            text-align: center;
            animation: pulseGlow 2.5s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(176, 16, 48, 0.15));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(176, 16, 48, 0.3));
            }
        }
        #overlay h1 {
            font-weight: 300;
            font-size: 1.8rem;
            letter-spacing: 6px;
            color: var(--accent);
            border: 1px solid rgba(176, 16, 48, 0.25);
            padding: 0.9rem 2.8rem;
            border-radius: 80px;
            background: rgba(176, 16, 48, 0.04);
            transition: 0.3s;
            user-select: none;
            pointer-events: none;
        }
        #overlay .sub {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 12px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        /* MUTE */
        #mute {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 9999;
            background: rgba(17, 19, 24, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(176, 16, 48, 0.2);
            border-radius: 12px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--soft);
            font-size: 1.1rem;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.85) translateY(-8px);
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: var(--shadow);
        }
        #mute.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }
        #mute:hover {
            background: rgba(176, 16, 48, 0.2);
            border-color: var(--accent);
            color: #fff;
        }

        /* ПРОГРЕСС */
        .progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            width: 100%;
            z-index: 999;
            background: transparent;
        }
        .progress .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-dim), var(--accent), var(--accent-dim));
            transition: width 0.15s ease;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР */
        .app {
            max-width: 1060px;
            width: 100%;
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .app.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* ШАПКА */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            background: rgba(17, 19, 24, 0.7);
            backdrop-filter: blur(16px);
            border-radius: var(--radius);
            padding: 16px 24px;
            margin-bottom: 28px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .header .profile {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .header .name {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 20%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .sub {
            font-size: 0.8rem;
            color: var(--soft);
            font-weight: 400;
        }

        .header .lang {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 40px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .header .lang button {
            background: transparent;
            border: none;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.7rem;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.25s;
            letter-spacing: 0.5px;
        }
        .header .lang button.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .header .lang button:hover:not(.active) {
            color: #fff;
        }

        /* НАВИГАЦИЯ */
        .nav {
            display: flex;
            gap: 4px;
            background: rgba(17, 19, 24, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 5px;
            margin-bottom: 32px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            flex-wrap: wrap;
        }
        .nav button {
            background: transparent;
            border: none;
            color: var(--soft);
            padding: 10px 26px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s;
            flex: 1 0 auto;
            letter-spacing: 0.3px;
        }
        .nav button.active {
            background: rgba(176, 16, 48, 0.15);
            color: #fff;
            box-shadow: inset 0 0 0 1px rgba(176, 16, 48, 0.15);
        }
        .nav button:hover:not(.active) {
            color: #fff;
            background: rgba(255, 255, 255, 0.03);
        }

        /* СЕКЦИИ */
        .section {
            background: rgba(17, 19, 24, 0.7);
            backdrop-filter: blur(16px);
            border-radius: var(--radius);
            padding: 28px 32px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            scroll-margin-top: 20px;
            transition: border-color 0.3s;
        }
        .section:hover {
            border-color: rgba(176, 16, 48, 0.08);
        }

        .section-title {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title i {
            color: var(--accent);
            font-size: 1rem;
        }

        .bio-text {
            color: var(--soft);
            font-size: 0.95rem;
            background: rgba(176, 16, 48, 0.04);
            padding: 6px 20px;
            border-radius: 40px;
            border: 1px solid rgba(176, 16, 48, 0.06);
            display: inline-block;
        }
        .bio-role {
            color: var(--muted);
            font-size: 0.85rem;
            margin-left: 8px;
        }

        /* КАРТОЧКИ СТАФФА */
        .staff-group {
            margin-bottom: 20px;
        }
        .staff-group:last-child {
            margin-bottom: 0;
        }
        .staff-group .group-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            padding-left: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
        }

        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 14px 12px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: default;
            position: relative;
        }
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(176, 16, 48, 0.02), transparent);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(176, 16, 48, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }
        .card:hover::before {
            opacity: 1;
        }
        .card .cname {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .card .cyear {
            font-size: 0.65rem;
            color: var(--muted);
            margin-top: 1px;
        }
        .card .crole {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 3px 12px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 5px;
            background: rgba(176, 16, 48, 0.06);
            color: var(--soft);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ПРОЕКТЫ */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 20px 22px;
            text-align: center;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .project-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: radial-gradient(circle at 50% 0%, rgba(176, 16, 48, 0.04), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .project-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(176, 16, 48, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }
        .project-card:hover::after {
            opacity: 1;
        }
        .project-card .pname {
            font-weight: 700;
            font-size: 1.1rem;
            position: relative;
            z-index: 1;
        }
        .project-card .pdesc {
            font-size: 0.8rem;
            color: var(--soft);
            margin-top: 2px;
            position: relative;
            z-index: 1;
        }
        .project-card .plinks {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }
        .project-card .plinks span {
            font-size: 0.65rem;
            color: var(--accent);
            background: rgba(176, 16, 48, 0.06);
            padding: 2px 14px;
            border-radius: 30px;
            border: 1px solid rgba(176, 16, 48, 0.08);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
        }
        .project-card .plinks span i {
            font-size: 0.7rem;
        }
        .project-card .plinks span:hover {
            background: rgba(176, 16, 48, 0.12);
        }

        /* АДАПТИВ */
        @media (max-width: 700px) {
            body {
                padding: 16px 12px;
            }
            .header {
                padding: 14px 18px;
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .header .profile {
                justify-content: center;
            }
            .header .lang {
                justify-content: center;
            }
            .nav button {
                padding: 8px 14px;
                font-size: 0.7rem;
                flex: 1 1 60px;
            }
            .section {
                padding: 20px 18px;
            }
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
            .card {
                padding: 12px 8px;
            }
            #overlay h1 {
                font-size: 1.2rem;
                padding: 0.6rem 1.6rem;
                letter-spacing: 4px;
            }
        }

        @media (max-width: 420px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .section {
                padding: 16px 12px;
            }
            .header .name {
                font-size: 1.1rem;
            }
        }

        ::selection {
            background: rgba(176, 16, 48, 0.3);
            color: #fff;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-dim);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="content">
            <h1>✦ нажмите в любом месте ✦</h1>
            <div class="sub">softmethod · visual dev</div>
        </div>
    </div>

    <audio id="bgm" loop preload="auto"><source src="song.mp3" type="audio/mp3"></audio>
    <button id="mute"><i class="fa-solid fa-volume-high"></i></button>

    <div class="progress"><div class="bar" id="progressBar"></div></div>

    <div class="app" id="app">

        <!-- ШАПКА -->
        <header class="header">
            <div class="profile">
                <div class="avatar"><img src="https://i.ibb.co/cXMGtTgv/avatar.png" alt="avatar" /></div>
                <div>
                    <div class="name">softmethod</div>
                    <div class="sub" id="subtitle">Cheat Hunter &amp; Pc Checker</div>
                </div>
            </div>
            <div class="lang">
                <button class="active" data-lang="ru">RU</button>
                <button data-lang="en">EN</button>
            </div>
        </header>

        <!-- НАВИГАЦИЯ -->
        <nav class="nav">
            <button class="active" data-target="staff"><i class="fa-solid fa-users" style="margin-right:6px;"></i> <span data-key="nav_staff">Стафф</span></button>
            <button data-target="projects"><i class="fa-regular fa-folder-open" style="margin-right:6px;"></i> <span data-key="nav_projects">Проекты</span></button>
        </nav>

        <!-- СТАФФ (без биографии) -->
        <section class="section" id="staff">
            <div class="section-title"><i class="fa-solid fa-users"></i> <span data-key="staff_title">Стафф-опыт</span></div>

            <!-- Сначала высший состав -->
            <div class="staff-group">
                <div class="group-label" data-key="staff_senior">Высший стафф</div>
                <div class="grid" id="seniorGrid"></div>
            </div>

            <!-- Потом начальный -->
            <div class="staff-group">
                <div class="group-label" data-key="staff_junior">Начальный состав</div>
                <div class="grid" id="juniorGrid"></div>
            </div>
        </section>

        <!-- ПРОЕКТЫ -->
        <section class="section" id="projects">
            <div class="section-title"><i class="fa-regular fa-folder-open"></i> <span data-key="projects_title">Мои проекты</span></div>
            <div class="projects-grid" id="projectsGrid"></div>
        </section>

    </div>

    <script>
        (function() {
            // ---------- ДАННЫЕ ----------
            const DATA = {
                junior: [
                    { name: "CloudyLand", role: "Moder", year: "2022", color: "#4a8cff" },
                    { name: "EasyMoney", role: "Moder", year: "2023", color: "#4a8cff" },
                    { name: "RedBee", role: "Moder & HEAD OF SS", year: "2023", color: "#4a8cff" },
                    { name: "Cristalix", role: "Helper", year: "2025", color: "#f5c842" },
                    { name: "HolyWorld", role: "Helper", year: "2025", color: "#f5c842" },
                    { name: "AgeraPvp", role: "Helper", year: "2025", color: "#f5c842" },
                ],
                senior: [
                    { name: "Revage", role: "Curator & HEAD OF SS", year: "2023-2026", color: "#ec5252" },
                    { name: "CakeWorld", role: "Head Admin", year: "2025", color: "#8B0000" },
                    { name: "BeeMC", role: "Admin & HEAD OF SS", year: "2024", color: "#ec5252" },
                    { name: "ProxWorld (1)", role: "Curator & HEAD OF SS", year: "2025", color: "#ec5252" },
                    { name: "ProxWorld (2)", role: "Curator & CHEAT HUNTER", year: "2025", color: "#ec5252" },
                    { name: "CookieWorld", role: "Admin", year: "2025", color: "#ec5252" },
                    { name: "SolarCloud", role: "Admin", year: "2025", color: "#ec5252" },
                    { name: "PremialClub", role: "Owner & HEAD OF SS", year: "2024", color: "#8B0000" },
                    { name: "PvpCore", role: "Owner & HEAD OF SS", year: "2024", color: "#8B0000" },
                    { name: "HightMine", role: "Admin & HEAD OF SS", year: "2025", color: "#ec5252" },
                ],
                projects: [
                    { name: "Screenshare Club", desc: "Сообщество по проверкам", discord: "https://discord.gg/ssclub",
                        site: "https://ssclubs.github.io/" }
                ]
            };

            // ---------- ПЕРЕВОДЫ ----------
            const LOCALES = {
                ru: {
                    nav_staff: "Стафф",
                    nav_projects: "Проекты",
                    staff_title: "Стафф-опыт",
                    staff_senior: "Высший стафф",
                    staff_junior: "Начальный состав",
                    projects_title: "Мои проекты",
                },
                en: {
                    nav_staff: "Staff",
                    nav_projects: "Projects",
                    staff_title: "Staff Experience",
                    staff_senior: "Senior Staff",
                    staff_junior: "Junior Staff",
                    projects_title: "My Projects",
                }
            };

            let currentLang = 'ru';

            // ---------- HELPER ----------
            function hexToRgba(hex, alpha = 0.12) {
                let c = hex.replace('#', '');
                if (c.length === 3) c = c.split('').map(x => x + x).join('');
                const bigint = parseInt(c, 16);
                const r = (bigint >> 16) & 255,
                    g = (bigint >> 8) & 255,
                    b = bigint & 255;
                return `rgba(${r},${g},${b},${alpha})`;
            }

            // ---------- РЕНДЕР СТАФФА ----------
            function renderStaff() {
                const jr = document.getElementById('juniorGrid');
                const sr = document.getElementById('seniorGrid');
                jr.innerHTML = '';
                sr.innerHTML = '';

                DATA.senior.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const color = item.color || '#aaa';
                    card.innerHTML = `
                        <div class="cname">${item.name}</div>
                        <div class="cyear">${item.year || ''}</div>
                        <div class="crole" style="background:${hexToRgba(color, 0.10)};border-color:${hexToRgba(color, 0.15)};color:${color};">${item.role}</div>
                    `;
                    sr.appendChild(card);
                });

                DATA.junior.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const color = item.color || '#aaa';
                    card.innerHTML = `
                        <div class="cname">${item.name}</div>
                        <div class="cyear">${item.year || ''}</div>
                        <div class="crole" style="background:${hexToRgba(color, 0.10)};border-color:${hexToRgba(color, 0.15)};color:${color};">${item.role}</div>
                    `;
                    jr.appendChild(card);
                });
            }

            // ---------- РЕНДЕР ПРОЕКТОВ ----------
            function renderProjects() {
                const grid = document.getElementById('projectsGrid');
                grid.innerHTML = '';
                DATA.projects.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'project-card';
                    div.innerHTML = `
                        <div class="pname">${p.name}</div>
                        <div class="pdesc">${p.desc}</div>
                        <div class="plinks">
                            <span><i class="fa-brands fa-discord"></i> discord.gg/ssclub</span>
                            <span><i class="fa-solid fa-globe"></i> ssclubs.github.io</span>
                        </div>
                    `;
                    div.addEventListener('click', () => {
                        window.open(p.discord, '_blank');
                        setTimeout(() => window.open(p.site, '_blank'), 350);
                    });
                    grid.appendChild(div);
                });
            }

            // ---------- ПЕРЕКЛЮЧЕНИЕ ЯЗЫКА ----------
            function applyLanguage(lang) {
                currentLang = lang;
                const dict = LOCALES[lang];
                document.querySelectorAll('[data-key]').forEach(el => {
                    const key = el.dataset.key;
                    if (dict[key] !== undefined) {
                        el.textContent = dict[key];
                    }
                });

                document.querySelectorAll('.lang button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === lang);
                });
            }

            // ---------- НАВИГАЦИЯ ----------
            function initNav() {
                const btns = document.querySelectorAll('.nav button');
                const sections = {
                    staff: document.getElementById('staff'),
                    projects: document.getElementById('projects'),
                };

                btns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const target = btn.dataset.target;
                        const el = sections[target];
                        if (el) {
                            const top = el.getBoundingClientRect().top + window.scrollY - 24;
                            window.scrollTo({ top, behavior: 'smooth' });
                        }
                        btns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    });
                });

                const sectionEls = Object.values(sections);
                window.addEventListener('scroll', () => {
                    const scrollY = window.scrollY + 100;
                    let active = 'staff';
                    sectionEls.forEach(sec => {
                        const rect = sec.getBoundingClientRect();
                        const offset = rect.top + window.scrollY;
                        if (scrollY >= offset - 20) active = sec.id;
                    });
                    btns.forEach(b => {
                        b.classList.toggle('active', b.dataset.target === active);
                    });

                    const st = window.scrollY;
                    const dh = document.documentElement.scrollHeight - window.innerHeight;
                    const p = dh > 0 ? (st / dh) * 100 : 0;
                    document.getElementById('progressBar').style.width = p + '%';
                }, { passive: true });
            }

            // ---------- АУДИО ----------
            function initAudio() {
                const overlay = document.getElementById('overlay');
                const muteBtn = document.getElementById('mute');
                const audio = document.getElementById('bgm');
                const app = document.getElementById('app');
                audio.volume = 0.06;

                function start() {
                    overlay.classList.add('hidden');
                    muteBtn.classList.add('visible');
                    app.classList.add('loaded');
                    audio.play().catch(() => {});
                }

                overlay.addEventListener('click', start, { once: true });

                audio.play().then(() => {
                    if (!overlay.classList.contains('hidden')) {
                        overlay.classList.add('hidden');
                        muteBtn.classList.add('visible');
                        app.classList.add('loaded');
                    }
                }).catch(() => {});

                muteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    audio.muted = !audio.muted;
                    muteBtn.innerHTML = audio.muted ? '<i class="fa-solid fa-volume-xmark"></i>' :
                        '<i class="fa-solid fa-volume-high"></i>';
                    muteBtn.style.borderColor = audio.muted ? 'rgba(255,255,255,0.06)' : 'rgba(176,16,48,0.2)';
                });
            }

            // ---------- ЗАПУСК ----------
            document.addEventListener('DOMContentLoaded', () => {
                renderStaff();
                renderProjects();
                initNav();
                initAudio();

                document.querySelectorAll('.lang button').forEach(btn => {
                    btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
                });
                applyLanguage('ru');
            });
        })();
    </script>
</body>
</html>
