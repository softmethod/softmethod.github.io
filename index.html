<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>softmethod · screenshare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg:         #000000;
            --bg-1:       #0a0a0a;
            --bg-2:       #111111;
            --bg-3:       #161616;
            --border:     #1f1f23;
            --border-2:   #2e2e35;
            --text:       #ffffff;
            --text-2:     #a1a1aa;
            --text-3:     #52525b;
            --accent:     #b01030;
            --accent-dim: #6a0018;
            --nav-h:      56px;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            font-size: 14px;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            padding: 32px 20px;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(176, 16, 48, 0.06), transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(106, 0, 24, 0.08), transparent 60%);
        }

        /* SPLASH */
        #splash {
            position: fixed; inset: 0; z-index: 9999;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 0.5rem;
            cursor: pointer;
            transition: opacity 0.25s ease;
        }
        #splash h1 {
            font-size: clamp(2.2rem, 6vw, 3.5rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            background: linear-gradient(90deg, #b01030 0%, #6a0018 50%, #b01030 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 2s linear infinite;
        }
        #splash p {
            font-size: 10px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #333;
            animation: blink 1.4s step-end infinite;
        }
        @keyframes shimmer { to { background-position: -200% center; } }
        @keyframes blink { 50% { opacity: 0; } }

        /* MUTE BTN */
        #mute-btn {
            position: fixed; top: calc(var(--nav-h) / 2);
            right: 1.25rem;
            transform: translateY(-50%);
            z-index: 1001;
            background: transparent;
            border: 1.5px solid var(--border-2);
            border-radius: 8px;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-2);
            font-size: 13px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.4s, border-color 0.2s, color 0.2s;
        }
        #mute-btn.show { opacity: 1; }
        #mute-btn:hover { border-color: var(--text-2); color: var(--text); }

        /* TOP NAV */
        #top-nav {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--nav-h);
            z-index: 1000;
            display: flex; align-items: center;
            padding: 0 1.5rem;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }
        .nav-logo {
            font-weight: 900;
            font-size: 0.95rem;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-right: auto;
        }
        .nav-links {
            display: flex; align-items: center; gap: 4px;
        }
        .nav-pill {
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-2);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            display: flex; align-items: center; gap: 6px;
            user-select: none;
        }
        .nav-pill:hover { color: var(--text); }
        .nav-pill.active {
            background: var(--bg-3);
            color: var(--text);
            border: 1px solid var(--border-2);
        }
        .nav-pill i { font-size: 0.75rem; }

        /* SCROLL BAR */
        .scroll-bar {
            position: fixed; top: var(--nav-h); left: 0;
            height: 2px; width: 0%;
            background: linear-gradient(90deg, var(--accent-dim), var(--accent));
            z-index: 1000;
            transition: width 0.15s linear;
        }

        /* PAGE */
        #page {
            max-width: 1060px;
            width: 100%;
            padding-top: calc(var(--nav-h) + 48px);
            padding-bottom: 80px;
            opacity: 0;
            transition: opacity 0.45s ease;
        }
        #page.show { opacity: 1; }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* HERO */
        #bio {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-bottom: 60px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 60px;
        }

        .void-orb-wrap {
            position: relative;
            width: 130px; height: 130px;
            margin-bottom: 1.5rem;
        }
        #void-orb {
            width: 130px; height: 130px;
            border-radius: 50%;
            display: block;
            border: 2px solid rgba(176,16,48,0.15);
            box-shadow: 0 0 40px rgba(176,16,48,0.15);
        }

        .hero-name {
            font-size: clamp(2.8rem, 7vw, 4.5rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1;
            background: linear-gradient(90deg, #fff 0%, var(--accent) 70%, #fff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 2.5s linear infinite;
        }

        .hero-role {
            margin-top: 0.6rem;
            font-size: 0.9rem;
            color: var(--text-2);
            font-weight: 500;
            display: flex; align-items: center; justify-content: center;
            gap: 0.4rem;
        }
        .hero-role i { font-size: 0.8rem; color: var(--text-3); }

        .bio-tags {
            display: flex; flex-wrap: wrap;
            justify-content: center; gap: 0.5rem;
            margin-top: 1.25rem;
        }
        .bio-tag {
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 5px 14px;
            font-size: 0.78rem;
            color: var(--text-2);
        }
        .bio-tag strong { color: var(--text); font-weight: 600; }

        /* SECTION LABEL */
        .section-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 1rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* LINKS */
        .links-area { margin-top: 2.5rem; width: 100%; text-align: left; }
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0.65rem;
        }
        .link-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.9rem 1.1rem;
            display: flex; align-items: center; gap: 0.75rem;
            text-decoration: none; color: inherit;
            transition: border-color 0.2s, transform 0.2s, background 0.2s;
        }
        .link-card:hover {
            border-color: var(--accent);
            background: var(--bg-2);
            transform: translateY(-2px);
        }
        .link-card i { font-size: 1.2rem; flex-shrink: 0; }
        .link-name { font-weight: 700; font-size: 0.85rem; }
        .link-handle { font-size: 0.72rem; color: var(--text-3); margin-top: 1px; }

        /* EXPERIENCE */
        #experience { scroll-margin-top: calc(var(--nav-h) + 24px); }

        .exp-header {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            margin-bottom: 0.4rem;
        }
        .exp-header h2 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .exp-sub {
            font-size: 0.75rem;
            color: var(--text-3);
            font-weight: 400;
        }

        .exp-disclaimer {
            display: flex; gap: 0.5rem; flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .badge {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 3px 12px;
            font-size: 0.7rem;
            color: var(--text-3);
        }

        .search-wrap {
            position: relative;
            margin-bottom: 1.25rem;
        }
        .search-icon {
            position: absolute;
            left: 0.9rem; top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            font-size: 0.75rem;
            pointer-events: none;
        }
        .exp-search {
            width: 100%;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.6rem 1rem 0.6rem 2.4rem;
            color: var(--text);
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        .exp-search::placeholder { color: var(--text-3); }
        .exp-search:focus { border-color: var(--accent); }

        .exp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
            gap: 0.5rem;
        }
        .exp-item {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
            display: flex; align-items: center; gap: 0.55rem;
            transition: border-color 0.15s, background 0.15s;
            cursor: default;
        }
        .exp-item:hover {
            border-color: var(--accent);
            background: var(--bg-2);
        }
        .exp-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--accent-dim);
            flex-shrink: 0;
            transition: background 0.15s;
        }
        .exp-item:hover .exp-dot { background: var(--accent); }
        .exp-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.76rem;
            color: var(--text-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 400;
        }
        .exp-item:hover .exp-name { color: var(--text); }
        .exp-footer {
            margin-top: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-3);
        }

        /* PROJECTS */
        #projects { scroll-margin-top: calc(var(--nav-h) + 24px); }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 0.75rem;
        }
        .project-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem 1.2rem;
            transition: border-color 0.25s, transform 0.2s, background 0.2s;
            cursor: pointer;
        }
        .project-card:hover {
            border-color: var(--accent);
            background: var(--bg-2);
            transform: translateY(-3px);
        }
        .project-card .pname {
            font-weight: 700;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
        }
        .project-card .pdesc {
            font-size: 0.82rem;
            color: var(--text-2);
            margin-top: 2px;
        }
        .project-card .plinks {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .project-card .plinks span {
            font-size: 0.7rem;
            color: var(--accent);
            background: rgba(176,16,48,0.06);
            padding: 3px 14px;
            border-radius: 30px;
            border: 1px solid rgba(176,16,48,0.08);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
            font-weight: 600;
            cursor: pointer;
        }
        .project-card .plinks span:hover {
            background: rgba(176,16,48,0.12);
        }

        /* RESPONSIVE */
        @media (max-width: 700px) {
            body { padding: 16px 12px; }
            .container { padding: 0 1rem; }
            .links-grid { grid-template-columns: 1fr; }
            .exp-grid { grid-template-columns: 1fr 1fr; }
            .projects-grid { grid-template-columns: 1fr; }
            .nav-logo { display: none; }
            #page { padding-top: calc(var(--nav-h) + 28px); }
        }
        @media (max-width: 420px) {
            .exp-grid { grid-template-columns: 1fr; }
        }

        ::selection { background: var(--accent); color: #fff; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>
<body>

<canvas id="snow-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;"></canvas>

<!-- SPLASH -->
<div id="splash">
    <h1>softmethod</h1>
    <p>click anywhere</p>
</div>

<audio id="bg-music" loop>
    <source src="song.mp3" type="audio/mp3">
</audio>

<button id="mute-btn" aria-label="Toggle mute">
    <i class="fa-solid fa-volume-high"></i>
</button>

<!-- NAV -->
<nav id="top-nav">
    <span class="nav-logo">softmethod</span>
    <div class="nav-links">
        <div class="nav-pill active" data-target="bio"><i class="fa-solid fa-user"></i> Bio</div>
        <div class="nav-pill" data-target="experience"><i class="fa-solid fa-briefcase"></i> Staff</div>
        <div class="nav-pill" data-target="projects"><i class="fa-regular fa-folder-open"></i> Projects</div>
    </div>
</nav>

<div class="scroll-bar" id="scroll-bar"></div>

<!-- PAGE -->
<div id="page">
    <div class="container">

        <!-- BIO -->
        <section id="bio">
            <div class="void-orb-wrap">
                <canvas id="void-orb" width="130" height="130"></canvas>
            </div>

            <h1 class="hero-name">softmethod</h1>

            <p class="hero-role">
                <i class="fa-solid fa-desktop"></i>
                Cheat Hunter · Screenshare Specialist
            </p>

            <div class="bio-tags">
                <span class="bio-tag"><strong>16</strong> y/o</span>
                <span class="bio-tag"><strong>England</strong>, UK</span>
                <span class="bio-tag"><strong>English</strong></span>
            </div>

            <!-- LINKS -->
            <div class="links-area">
                <p class="section-label"><i class="fa-solid fa-link"></i> Links</p>
                <div class="links-grid" id="linksGrid"></div>
            </div>
        </section>

        <!-- EXPERIENCE / STAFF -->
        <section id="experience">
            <div class="exp-header">
                <h2>Staff Experience</h2>
                <span class="exp-sub">Senior &amp; Junior</span>
            </div>
            <div class="exp-disclaimer">
                <span class="badge">⚠ Partial record</span>
                <span class="badge">&lt;50% of total experience</span>
            </div>

            <div class="search-wrap">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input class="exp-search" id="expSearch" type="text" placeholder="Search communities…">
            </div>

            <div class="exp-grid" id="expGrid"></div>
            <p class="exp-footer" id="expCount"></p>
        </section>

        <!-- PROJECTS -->
        <section id="projects">
            <div class="exp-header">
                <h2>Projects</h2>
                <span class="exp-sub">Community &amp; Tools</span>
            </div>
            <div class="projects-grid" id="projectsGrid"></div>
        </section>

    </div>
</div>

<script>
// ── DATA ──────────────────────────────────────
const DATA = {
    links: [
        { name: "Screenshare Club", handle: "Discord Server", icon: "fa-brands fa-discord", color: "#5865F2", url: "https://discord.gg/ssclub" },
        { name: "Discord", handle: "@softmethod", icon: "fa-brands fa-discord", color: "#5865F2", url: null, copy: "softmethod" }
    ],
    senior: [
        { name: "Revage", role: "Curator & HEAD OF SS" },
        { name: "CakeWorld", role: "Head Admin" },
        { name: "BeeMC", role: "Admin & HEAD OF SS" },
        { name: "ProxWorld (1)", role: "Curator & HEAD OF SS" },
        { name: "ProxWorld (2)", role: "Curator & CHEAT HUNTER" },
        { name: "CookieWorld", role: "Admin" },
        { name: "SolarCloud", role: "Admin" },
        { name: "PremialClub", role: "Owner & HEAD OF SS" },
        { name: "PvpCore", role: "Owner & HEAD OF SS" },
        { name: "HightMine", role: "Admin & HEAD OF SS" },
    ],
    junior: [
        { name: "CloudyLand", role: "Moder" },
        { name: "EasyMoney", role: "Moder" },
        { name: "RedBee", role: "Moder & HEAD OF SS" },
        { name: "Cristalix", role: "Helper" },
        { name: "HolyWorld", role: "Helper" },
        { name: "AgeraPvp", role: "Helper" },
    ],
    projects: [
        {
            name: "Screenshare Club",
            desc: "Сообщество по проверкам / Screenshare Community",
            discord: "https://discord.gg/ssclub",
            site: "https://ssclubs.github.io/"
        }
    ]
};

// ── LINKS ──────────────────────────────────────
function initLinks() {
    const grid = document.getElementById('linksGrid');
    if (!DATA.links.length) {
        grid.innerHTML = '<span class="no-links">No links added yet.</span>';
        return;
    }
    DATA.links.forEach(item => {
        if (item.copy) {
            const div = document.createElement('div');
            div.className = 'link-card copy-card';
            div.setAttribute('data-copy', item.copy);
            div.innerHTML = `
                <i class="${item.icon}" style="color:${item.color}"></i>
                <div style="flex:1">
                    <div class="link-name">${item.name}</div>
                    <div class="link-handle" id="copy-handle-${item.copy}">${item.copy}</div>
                </div>
                <span class="copy-hint"><i class="fa-regular fa-copy"></i></span>`;
            div.addEventListener('click', () => {
                navigator.clipboard.writeText(item.copy).then(() => {
                    const hint = div.querySelector('.copy-hint');
                    const handle = div.querySelector('.link-handle');
                    hint.innerHTML = '<i class="fa-solid fa-check"></i>';
                    handle.textContent = 'Copied!';
                    hint.style.color = '#b01030';
                    handle.style.color = '#b01030';
                    setTimeout(() => {
                        hint.innerHTML = '<i class="fa-regular fa-copy"></i>';
                        handle.textContent = item.copy;
                        hint.style.color = '';
                        handle.style.color = '';
                    }, 2000);
                });
            });
            grid.appendChild(div);
        } else {
            const a = document.createElement('a');
            a.href = item.url; a.target = '_blank'; a.rel = 'noopener';
            a.className = 'link-card';
            a.innerHTML = `
                <i class="${item.icon}" style="color:${item.color}"></i>
                <div>
                    <div class="link-name">${item.name}</div>
                    <div class="link-handle">${item.handle}</div>
                </div>`;
            grid.appendChild(a);
        }
    });
}

// ── EXPERIENCE ────────────────────────────────
function renderExp(q = '') {
    const grid = document.getElementById('expGrid');
    const count = document.getElementById('expCount');
    const term = q.toLowerCase().trim();

    const all = [...DATA.senior.map(s => ({ ...s, group: 'senior' })), ...DATA.junior.map(j => ({ ...j, group: 'junior' }))];
    const list = term ? all.filter(e => e.name.toLowerCase().includes(term)) : all;

    grid.innerHTML = '';
    list.forEach(item => {
        const d = document.createElement('div');
        d.className = 'exp-item';
        d.innerHTML = `<div class="exp-dot"></div><span class="exp-name" title="${item.name} · ${item.role}">${item.name}</span>`;
        grid.appendChild(d);
    });

    count.textContent = term
        ? `// ${list.length} result${list.length !== 1 ? 's' : ''} for "${q}"`
        : `// showing ${list.length} of ${all.length} staff positions`;
}
document.getElementById('expSearch').addEventListener('input', e => renderExp(e.target.value));

// ── PROJECTS ──────────────────────────────────
function renderProjects() {
    const grid = document.getElementById('projectsGrid');
    grid.innerHTML = '';
    DATA.projects.forEach(p => {
        const div = document.createElement('div');
        div.className = 'project-card';
        div.innerHTML = `
            <div class="pname">${p.name}</div>
            <div class="pdesc">${p.desc}</div>
            <div class="plinks">
                <span data-link="${p.discord}"><i class="fa-brands fa-discord"></i> Discord</span>
                <span data-link="${p.site}"><i class="fa-solid fa-globe"></i> Site</span>
            </div>
        `;
        // клик по карточке открывает дискорд
        div.addEventListener('click', (e) => {
            if (e.target.closest('.plinks span')) return;
            window.open(p.discord, '_blank');
        });
        div.querySelectorAll('.plinks span').forEach(span => {
            span.addEventListener('click', (e) => {
                e.stopPropagation();
                const link = span.dataset.link;
                if (link) window.open(link, '_blank');
            });
        });
        grid.appendChild(div);
    });
}

// ── NAV + SCROLL ──────────────────────────────
function onScroll() {
    const scrolled = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    const pct = scrolled > 0 ? (window.scrollY / scrolled) * 100 : 0;
    document.getElementById('scroll-bar').style.width = pct + '%';

    const mid = window.scrollY + window.innerHeight / 2;
    const secs = document.querySelectorAll('section[id]');
    let closest = secs[0];
    let minD = Infinity;
    secs.forEach(s => {
        const d = Math.abs(mid - (s.offsetTop + s.offsetHeight / 2));
        if (d < minD) { minD = d; closest = s; }
    });
    document.querySelectorAll('.nav-pill').forEach(p => {
        p.classList.toggle('active', p.dataset.target === closest.id);
    });
}
window.addEventListener('scroll', onScroll);

document.querySelectorAll('.nav-pill').forEach(p => {
    p.addEventListener('click', () => {
        const id = p.dataset.target;
        const el = document.getElementById(id);
        if (!el) return;
        const navH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nav-h'));
        window.scrollTo({ top: id === 'bio' ? 0 : el.offsetTop - navH - 16, behavior: 'smooth' });
    });
});

const music = document.getElementById('bg-music');
const muteBtn = document.getElementById('mute-btn');
const splash = document.getElementById('splash');
const page = document.getElementById('page');
music.volume = 0.06;

function reveal() {
    splash.style.opacity = '0';
    splash.style.pointerEvents = 'none';
    setTimeout(() => splash.remove(), 300);
    document.body.style.overflowY = 'auto';
    page.classList.add('show');
    muteBtn.classList.add('show');
    music.play().catch(() => {});
}
document.addEventListener('click', reveal, { once: true });

muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    music.muted = !music.muted;
    muteBtn.querySelector('i').className = music.muted
        ? 'fa-solid fa-volume-xmark'
        : 'fa-solid fa-volume-high';
});

// ── VOID ORB ──────────────────────────────────
(function() {
    const canvas = document.getElementById('void-orb');
    const ctx = canvas.getContext('2d');
    const SIZE = 130;
    const cx = SIZE / 2, cy = SIZE / 2;

    const ORBITERS = Array.from({ length: 18 }, (_, i) => ({
        angle: (i / 18) * Math.PI * 2,
        speed: 0.004 + Math.random() * 0.006,
        orbit: 38 + Math.random() * 18,
        size: 1.2 + Math.random() * 2,
        opacity: 0.4 + Math.random() * 0.5
    }));

    const SWIRL = Array.from({ length: 28 }, (_, i) => ({
        angle: (i / 28) * Math.PI * 2,
        speed: -0.008 - Math.random() * 0.01,
        orbit: 10 + Math.random() * 18,
        size: 0.8 + Math.random() * 1.2,
        opacity: 0.3 + Math.random() * 0.4
    }));

    let t = 0;
    function draw() {
        ctx.clearRect(0, 0, SIZE, SIZE);
        t += 0.016;

        // Outer glow
        const outerGlow = ctx.createRadialGradient(cx, cy, 28, cx, cy, 65);
        outerGlow.addColorStop(0, 'rgba(176,16,48,0.0)');
        outerGlow.addColorStop(0.6, 'rgba(176,16,48,0.08)');
        outerGlow.addColorStop(1, 'rgba(176,16,48,0.0)');
        ctx.beginPath();
        ctx.arc(cx, cy, 65, 0, Math.PI * 2);
        ctx.fillStyle = outerGlow;
        ctx.fill();

        // Core
        const core = ctx.createRadialGradient(cx - 8, cy - 8, 2, cx, cy, 28);
        core.addColorStop(0, 'rgba(220,180,255,0.9)');
        core.addColorStop(0.25, 'rgba(176,16,48,0.85)');
        core.addColorStop(0.6, 'rgba(88,28,135,0.7)');
        core.addColorStop(1, 'rgba(0,0,0,0.95)');
        ctx.beginPath();
        ctx.arc(cx, cy, 28, 0, Math.PI * 2);
        ctx.fillStyle = core;
        ctx.shadowColor = 'rgba(176,16,48,0.9)';
        ctx.shadowBlur = 22;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Pulse ring
        const pulse = 0.5 + 0.5 * Math.sin(t * 1.8);
        ctx.beginPath();
        ctx.arc(cx, cy, 30 + pulse * 3, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(176,16,48,${0.15 + pulse * 0.25})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Swirl
        SWIRL.forEach(p => {
            p.angle += p.speed;
            const x = cx + Math.cos(p.angle) * p.orbit;
            const y = cy + Math.sin(p.angle) * p.orbit;
            ctx.beginPath();
            ctx.arc(x, y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(220,180,255,${p.opacity})`;
            ctx.fill();
        });

        // Orbiters
        ORBITERS.forEach(p => {
            p.angle += p.speed;
            const wobble = Math.sin(p.angle * 3 + t) * 4;
            const x = cx + Math.cos(p.angle) * (p.orbit + wobble);
            const y = cy + Math.sin(p.angle) * (p.orbit + wobble) * 0.55;
            ctx.beginPath();
            ctx.arc(x, y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(176,16,48,${p.opacity})`;
            ctx.shadowColor = 'rgba(176,16,48,0.8)';
            ctx.shadowBlur = 5;
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        requestAnimationFrame(draw);
    }
    draw();
})();

// ── SNOW ──────────────────────────────────────
(function() {
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');
    let W = innerWidth, H = innerHeight;
    canvas.width = W; canvas.height = H;
    window.addEventListener('resize', () => { W = innerWidth; H = innerHeight; canvas.width = W; canvas.height = H; });
    const SHAPES = ['star', 'diamond', 'cross', 'circle'];
    const flakes = Array.from({ length: 80 }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 3.5 + 1.2,
        speed: Math.random() * 0.8 + 0.3,
        wind: Math.random() * 0.4 - 0.2,
        opacity: Math.random() * 0.5 + 0.15,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: Math.random() * 0.012 + 0.004,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.02,
        shape: SHAPES[Math.floor(Math.random() * SHAPES.length)]
    }));

    function drawStar(ctx, r) { const pts=4, inner=r*0.45; ctx.beginPath(); for(let i=0;i<pts*2;i++){ const a=(i*Math.PI)/pts-Math.PI/2; const rad=i%2===0?r:inner; i===0?ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad):ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad); } ctx.closePath(); }
    function drawDiamond(ctx, r) { ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(r*0.6,0); ctx.lineTo(0,r); ctx.lineTo(-r*0.6,0); ctx.closePath(); }
    function drawCross(ctx, r) { const t=r*0.3; ctx.beginPath(); ctx.moveTo(-t,-r); ctx.lineTo(t,-r); ctx.lineTo(t,-t); ctx.lineTo(r,-t); ctx.lineTo(r,t); ctx.lineTo(t,t); ctx.lineTo(t,r); ctx.lineTo(-t,r); ctx.lineTo(-t,t); ctx.lineTo(-r,t); ctx.lineTo(-r,-t); ctx.lineTo(-t,-t); ctx.closePath(); }
    function drawCircle(ctx, r) { ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); }

    (function animate() {
        ctx.clearRect(0, 0, W, H);
        flakes.forEach(f => {
            f.wobble += f.wobbleSpeed;
            f.rot += f.rotSpeed;
            f.x += f.wind + Math.sin(f.wobble) * 0.3;
            f.y += f.speed;
            if (f.y > H + 6) { f.y = -6; f.x = Math.random() * W; }
            if (f.x > W + 6) f.x = -6;
            if (f.x < -6) f.x = W + 6;
            ctx.save();
            ctx.globalAlpha = f.opacity;
            ctx.translate(f.x, f.y);
            ctx.rotate(f.rot);
            ctx.fillStyle = '#b01030';
            ctx.shadowColor = 'rgba(176,16,48,0.6)';
            ctx.shadowBlur = f.r * 2;
            if (f.shape === 'star') drawStar(ctx, f.r);
            else if (f.shape === 'diamond') drawDiamond(ctx, f.r);
            else if (f.shape === 'cross') drawCross(ctx, f.r);
            else drawCircle(ctx, f.r);
            ctx.fill();
            ctx.restore();
        });
        requestAnimationFrame(animate);
    })();
})();
</script>
