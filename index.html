<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>softmethod</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0b0b0b;
            --card: #121212;
            --accent: #a01020;
            --accent-dim: #6a0010;
            --text: #f0f0f0;
            --soft: #b0b0b8;
            --muted: #7a7a82;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(139, 0, 0, 0.08), transparent 70%),
                radial-gradient(circle at 80% 70%, rgba(69, 5, 23, 0.10), transparent 60%);
            z-index: -2;
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDQwIDQwIj48cGF0aCBkPSJNMjAgM2wxMCAxMC0xMCAxMC0xMC0xMCAxMC0xMHoiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wMykiLz48L3N2Zz4=');
            opacity: 0.5;
            z-index: -1;
            pointer-events: none;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.4s, visibility 0.4s;
        }
        #overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #overlay h1 {
            font-weight: 300;
            font-size: 1.5rem;
            letter-spacing: 4px;
            color: var(--accent);
            padding: 0.8rem 2.2rem;
            border-radius: 60px;
            border: 1px solid rgba(160, 16, 32, 0.3);
            background: rgba(160, 16, 32, 0.06);
            pointer-events: none;
            user-select: none;
        }

        #mute {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 100;
            background: rgba(18, 18, 18, 0.7);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(160, 16, 32, 0.3);
            border-radius: 10px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ddd;
            font-size: 1.1rem;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
            transition: all 0.25s;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        }
        #mute.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        #mute:hover {
            background: rgba(160, 16, 32, 0.25);
            border-color: var(--accent);
        }

        .scroll-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            width: 100%;
            z-index: 100;
        }
        .scroll-bar div {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-dim), var(--accent));
            transition: width 0.15s;
        }

        .app {
            max-width: 1100px;
            width: 100%;
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.7s, transform 0.7s;
        }
        .app.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* компактная шапка */
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            background: rgba(18, 18, 18, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 18px;
            padding: 12px 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .top .profile {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .top .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            overflow: hidden;
            flex-shrink: 0;
        }
        .top .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .top .name {
            font-weight: 700;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .top .sub {
            font-size: 0.78rem;
            color: var(--soft);
        }
        .top .lang {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 30px;
            padding: 3px;
        }
        .top .lang button {
            background: transparent;
            border: none;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.5px;
        }
        .top .lang button.active {
            background: var(--accent);
            color: #fff;
        }
        .top .lang button:hover:not(.active) {
            color: #fff;
        }

        /* навигация */
        .nav {
            display: flex;
            gap: 4px;
            background: rgba(18, 18, 18, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
        }
        .nav button {
            background: transparent;
            border: none;
            color: var(--soft);
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            flex: 1 0 auto;
        }
        .nav button.active {
            background: rgba(160, 16, 32, 0.15);
            color: #fff;
        }
        .nav button:hover:not(.active) {
            color: #fff;
        }

        /* секции */
        .section {
            background: rgba(18, 18, 18, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            scroll-margin-top: 16px;
        }
        .section-title {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title i {
            color: var(--accent);
            font-size: 0.9rem;
        }

        .bio-text {
            color: var(--soft);
            font-size: 0.9rem;
            background: rgba(160, 16, 32, 0.04);
            padding: 4px 14px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid rgba(160, 16, 32, 0.06);
        }

        /* сетки */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
        }
        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 10px 12px;
            text-align: center;
            transition: 0.25s;
            cursor: default;
        }
        .card:hover {
            background: rgba(160, 16, 32, 0.05);
            border-color: rgba(160, 16, 32, 0.15);
            transform: translateY(-2px);
        }
        .card .name {
            font-weight: 600;
            font-size: 0.85rem;
        }
        .card .role {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 2px 10px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 4px;
            background: rgba(160, 16, 32, 0.08);
            color: var(--soft);
            border: 1px solid transparent;
        }
        .card .year {
            font-size: 0.65rem;
            color: var(--muted);
        }

        .card-link {
            cursor: pointer;
        }
        .card-link:hover {
            background: rgba(160, 16, 32, 0.08);
            border-color: var(--accent);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }
        .project-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 14px 16px;
            text-align: center;
            transition: 0.25s;
            cursor: pointer;
        }
        .project-card:hover {
            background: rgba(160, 16, 32, 0.06);
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .project-card .pname {
            font-weight: 700;
            font-size: 1rem;
        }
        .project-card .pdesc {
            font-size: 0.75rem;
            color: var(--soft);
            margin-top: 2px;
        }
        .project-card .plink {
            font-size: 0.65rem;
            color: var(--accent);
            margin-top: 6px;
            word-break: break-all;
        }

        @media (max-width: 600px) {
            .top {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .top .profile {
                justify-content: center;
            }
            .top .lang {
                justify-content: center;
            }
            .nav button {
                flex: 1 1 80px;
                font-size: 0.7rem;
                padding: 6px 10px;
            }
            .section {
                padding: 16px;
            }
            .grid {
                grid-template-columns: 1fr 1fr;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }

        ::selection {
            background: rgba(160, 16, 32, 0.3);
            color: #fff;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-dim);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="overlay"><h1>✦ нажмите в любом месте ✦</h1></div>

    <audio id="bgm" loop preload="auto"><source src="song.mp3" type="audio/mp3"></audio>
    <button id="mute"><i class="fa-solid fa-volume-high"></i></button>

    <div class="scroll-bar"><div id="progress"></div></div>

    <div class="app" id="app">

        <!-- шапка -->
        <div class="top">
            <div class="profile">
                <div class="avatar"><img src="https://i.ibb.co/cXMGtTgv/avatar.png" alt="avatar" /></div>
                <div>
                    <div class="name">softmethod</div>
                    <div class="sub" id="subtitle">Cheat Hunter &amp; Pc Checker</div>
                </div>
            </div>
            <div class="lang">
                <button class="active" data-lang="ru">RU</button>
                <button data-lang="en">EN</button>
            </div>
        </div>

        <!-- навигация -->
        <div class="nav">
            <button class="active" data-target="bio">Биография</button>
            <button data-target="staff">Стафф</button>
            <button data-target="projects">Проекты</button>
        </div>

        <!-- БИО -->
        <div class="section" id="bio">
            <div class="section-title"><i class="fa-regular fa-user"></i> <span data-key="bio_title">Биография</span></div>
            <div style="display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;">
                <span class="bio-text" data-key="bio_text">montegs visual dev</span>
                <span style="color:var(--muted);font-size:0.8rem;" data-key="bio_role">Cheat Hunter &amp; Pc Checker</span>
            </div>
        </div>

        <!-- СТАФФ -->
        <div class="section" id="staff">
            <div class="section-title"><i class="fa-regular fa-briefcase"></i> <span data-key="staff_title">Стафф-опыт</span></div>

            <!-- Junior / Middle -->
            <div style="margin-bottom:16px;">
                <div style="font-size:0.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;" data-key="staff_junior">Начальный состав</div>
                <div class="grid" id="juniorGrid"></div>
            </div>

            <!-- Senior -->
            <div>
                <div style="font-size:0.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;" data-key="staff_senior">Высший стафф</div>
                <div class="grid" id="seniorGrid"></div>
            </div>
        </div>

        <!-- ПРОЕКТЫ -->
        <div class="section" id="projects">
            <div class="section-title"><i class="fa-regular fa-folder-open"></i> <span data-key="projects_title">Мои проекты</span></div>
            <div class="projects-grid" id="projectsGrid"></div>
        </div>

    </div>

    <script>
        (function() {
            // ---------- ДАННЫЕ ----------
            const DATA = {
                // только майнкрафт, две категории
                junior: [
                    { name: "CloudyLand", role: "Moder", year: "2022", color: "#0000FF" },
                    { name: "EasyMoney", role: "Moder", year: "2023", color: "#0000FF" },
                    { name: "RedBee", role: "Moder & HEAD OF SS", year: "2023", color: "#0000FF" },
                    { name: "Cristalix", role: "Helper", year: "2025", color: "#FFD700" },
                    { name: "HolyWorld", role: "Helper", year: "2025", color: "#FFD700" },
                    { name: "AgeraPvp", role: "Helper", year: "2025", color: "#FFD700" },
                ],
                senior: [
                    { name: "Revage", role: "Curator & HEAD OF SS", year: "2023-2026", color: "#EC5252" },
                    { name: "CakeWorld", role: "Head Admin", year: "2025", color: "#8B0000" },
                    { name: "BeeMC", role: "Admin & HEAD OF SS", year: "2024", color: "#EC5252" },
                    { name: "ProxWorld (1)", role: "Curator & HEAD OF SS", year: "2025", color: "#EC5252" },
                    { name: "ProxWorld (2)", role: "Curator & CHEAT HUNTER", year: "2025", color: "#EC5252" },
                    { name: "CookieWorld", role: "Admin", year: "2025", color: "#EC5252" },
                    { name: "SolarCloud", role: "Admin", year: "2025", color: "#EC5252" },
                    { name: "PremialClub", role: "Owner & HEAD OF SS", year: "2024", color: "#8B0000" },
                    { name: "PvpCore", role: "Owner & HEAD OF SS", year: "2024", color: "#8B0000" },
                    { name: "HightMine", role: "Admin & HEAD OF SS", year: "2025", color: "#EC5252" },
                ],
                projects: [
                    { name: "Screenshare Club", desc: "Сообщество по скриншерингу", discord: "https://discord.gg/ssclub", site: "https://ssclubs.github.io/" }
                ]
            };

            // ---------- ПЕРЕВОДЫ ----------
            const LOCALES = {
                ru: {
                    bio_title: "Биография",
                    bio_text: "montegs visual dev",
                    bio_role: "Cheat Hunter & Pc Checker",
                    staff_title: "Стафф-опыт",
                    staff_junior: "Начальный состав",
                    staff_senior: "Высший стафф",
                    projects_title: "Мои проекты",
                    // для карточек стаффа перевод не нужен — имена и роли остаются
                },
                en: {
                    bio_title: "Biography",
                    bio_text: "montegs visual dev",
                    bio_role: "Cheat Hunter & Pc Checker",
                    staff_title: "Staff Experience",
                    staff_junior: "Junior Staff",
                    staff_senior: "Senior Staff",
                    projects_title: "My Projects",
                }
            };

            let currentLang = 'ru';

            // ---------- HELPER ----------
            function hexToRgba(hex, alpha = 0.12) {
                let c = hex.replace('#', '');
                if (c.length === 3) c = c.split('').map(x => x + x).join('');
                const bigint = parseInt(c, 16);
                const r = (bigint >> 16) & 255,
                    g = (bigint >> 8) & 255,
                    b = bigint & 255;
                return `rgba(${r},${g},${b},${alpha})`;
            }

            // ---------- РЕНДЕР СТАФФА ----------
            function renderStaff() {
                const juniorGrid = document.getElementById('juniorGrid');
                const seniorGrid = document.getElementById('seniorGrid');
                juniorGrid.innerHTML = '';
                seniorGrid.innerHTML = '';

                DATA.junior.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const color = item.color || '#aaa';
                    card.innerHTML = `
                        <div class="name">${item.name}</div>
                        <div class="year">${item.year || ''}</div>
                        <div class="role" style="background:${hexToRgba(color, 0.12)};border-color:${hexToRgba(color, 0.2)};color:${color};">${item.role}</div>
                    `;
                    juniorGrid.appendChild(card);
                });

                DATA.senior.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const color = item.color || '#aaa';
                    card.innerHTML = `
                        <div class="name">${item.name}</div>
                        <div class="year">${item.year || ''}</div>
                        <div class="role" style="background:${hexToRgba(color, 0.12)};border-color:${hexToRgba(color, 0.2)};color:${color};">${item.role}</div>
                    `;
                    seniorGrid.appendChild(card);
                });
            }

            // ---------- РЕНДЕР ПРОЕКТОВ ----------
            function renderProjects() {
                const grid = document.getElementById('projectsGrid');
                grid.innerHTML = '';
                DATA.projects.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'project-card';
                    div.innerHTML = `
                        <div class="pname">${p.name}</div>
                        <div class="pdesc">${p.desc}</div>
                        <div class="plink"><i class="fa-brands fa-discord"></i> discord.gg/ssclub</div>
                        <div class="plink"><i class="fa-solid fa-globe"></i> ssclubs.github.io</div>
                    `;
                    // клик по карточке — открываем ссылки
                    div.addEventListener('click', () => {
                        window.open(p.discord, '_blank');
                        setTimeout(() => window.open(p.site, '_blank'), 300);
                    });
                    grid.appendChild(div);
                });
            }

            // ---------- ПЕРЕКЛЮЧЕНИЕ ЯЗЫКА ----------
            function applyLanguage(lang) {
                currentLang = lang;
                const dict = LOCALES[lang];
                document.querySelectorAll('[data-key]').forEach(el => {
                    const key = el.dataset.key;
                    if (dict[key] !== undefined) {
                        if (el.tagName === 'SPAN' || el.tagName === 'DIV') {
                            el.textContent = dict[key];
                        } else {
                            el.textContent = dict[key];
                        }
                    }
                });
                // обновляем subtitle в шапке
                document.getElementById('subtitle').textContent = dict.bio_role || 'Cheat Hunter & Pc Checker';

                // кнопки языка
                document.querySelectorAll('.lang button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === lang);
                });
            }

            // ---------- НАВИГАЦИЯ (скролл) ----------
            function initNav() {
                const btns = document.querySelectorAll('.nav button');
                const sections = {
                    bio: document.getElementById('bio'),
                    staff: document.getElementById('staff'),
                    projects: document.getElementById('projects'),
                };

                btns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const target = btn.dataset.target;
                        const el = sections[target];
                        if (el) {
                            const top = el.getBoundingClientRect().top + window.scrollY - 20;
                            window.scrollTo({ top, behavior: 'smooth' });
                        }
                        btns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    });
                });

                // подсветка при скролле
                const sectionEls = Object.values(sections);
                window.addEventListener('scroll', () => {
                    const scrollY = window.scrollY + 100;
                    let active = 'bio';
                    sectionEls.forEach(sec => {
                        const rect = sec.getBoundingClientRect();
                        const offset = rect.top + window.scrollY;
                        if (scrollY >= offset - 20) active = sec.id;
                    });
                    btns.forEach(b => {
                        b.classList.toggle('active', b.dataset.target === active);
                    });
                }, { passive: true });

                // прогресс
                window.addEventListener('scroll', () => {
                    const st = window.scrollY;
                    const dh = document.documentElement.scrollHeight - window.innerHeight;
                    const p = dh > 0 ? (st / dh) * 100 : 0;
                    document.getElementById('progress').style.width = p + '%';
                }, { passive: true });
            }

            // ---------- АУДИО ----------
            function initAudio() {
                const overlay = document.getElementById('overlay');
                const muteBtn = document.getElementById('mute');
                const audio = document.getElementById('bgm');
                const app = document.getElementById('app');
                audio.volume = 0.07;

                function start() {
                    overlay.classList.add('hidden');
                    muteBtn.classList.add('visible');
                    app.classList.add('loaded');
                    audio.play().catch(() => {});
                }

                overlay.addEventListener('click', start, { once: true });

                audio.play().then(() => {
                    if (!overlay.classList.contains('hidden')) {
                        overlay.classList.add('hidden');
                        muteBtn.classList.add('visible');
                        app.classList.add('loaded');
                    }
                }).catch(() => {});

                muteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    audio.muted = !audio.muted;
                    muteBtn.innerHTML = audio.muted ? '<i class="fa-solid fa-volume-xmark"></i>' :
                        '<i class="fa-solid fa-volume-high"></i>';
                });
            }

            // ---------- ЗАПУСК ----------
            document.addEventListener('DOMContentLoaded', () => {
                renderStaff();
                renderProjects();
                initNav();
                initAudio();

                // язык
                document.querySelectorAll('.lang button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        applyLanguage(btn.dataset.lang);
                    });
                });
                applyLanguage('ru');
            });
        })();
    </script>
</body>
</html>
