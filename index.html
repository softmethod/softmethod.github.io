<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>softmethod · visual dev</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #0b0b0b;
            --bg-card: #121212;
            --border-glow: rgba(139, 0, 0, 0.4);
            --accent: #a01020;
            --accent-dim: #6a0010;
            --text-main: #f0f0f0;
            --text-soft: #b0b0b8;
            --text-muted: #7a7a82;
            --shadow-heavy: 0 20px 40px -12px rgba(0, 0, 0, 0.8);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            line-height: 1.5;
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(139, 0, 0, 0.08), transparent 70%),
                radial-gradient(circle at 80% 70%, rgba(69, 5, 23, 0.12), transparent 60%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDQwIDQwIj48cGF0aCBkPSJNMjAgM2wxMCAxMC0xMCAxMC0xMC0xMCAxMC0xMHoiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wMykiLz48L3N2Zz4=');
            opacity: 0.6;
            z-index: -1;
            pointer-events: none;
        }

        /* АУДИО ОВЕРЛЕЙ — исправлен */
        #bg-start-audio {
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            display: flex !important;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            opacity: 1;
            visibility: visible;
        }
        #bg-start-audio.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #bg-start-audio h1 {
            font-weight: 300;
            font-size: 1.6rem;
            letter-spacing: 4px;
            color: var(--accent);
            background: rgba(160, 16, 32, 0.08);
            padding: 0.8rem 2.2rem;
            border-radius: 60px;
            border: 1px solid rgba(160, 16, 32, 0.3);
            box-shadow: 0 0 40px rgba(160, 16, 32, 0.2);
            transition: all 0.25s;
            user-select: none;
            pointer-events: none; /* чтобы клик проходил сквозь текст */
        }
        #bg-start-audio:hover h1 {
            background: rgba(160, 16, 32, 0.18);
            transform: scale(1.02);
            box-shadow: 0 0 60px rgba(160, 16, 32, 0.3);
        }

        #mute-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            background: rgba(18, 18, 18, 0.7);
            backdrop-filter: blur(6px);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ddd;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.25s;
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
            box-shadow: var(--shadow-heavy);
        }
        #mute-btn.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        #mute-btn:hover {
            background: rgba(160, 16, 32, 0.25);
            border-color: var(--accent);
            color: #fff;
        }

        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 100%;
            background: transparent;
            z-index: 999;
        }
        .scroll-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-dim), var(--accent), var(--accent-dim));
            border-radius: 0 2px 2px 0;
            box-shadow: 0 0 12px rgba(160, 16, 32, 0.4);
            transition: width 0.15s ease;
        }

        .app-container {
            display: flex;
            width: 100%;
            max-width: 1360px;
            margin: 0 auto;
            padding: 24px 28px;
            gap: 28px;
            min-height: 100vh;
            align-items: flex-start;
            opacity: 0;
            transform: translateY(18px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .app-container.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        .left-panel {
            position: sticky;
            top: 28px;
            flex: 0 0 240px;
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: var(--shadow-heavy);
            padding: 1.2rem 0.6rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .left-panel::-webkit-scrollbar {
            width: 3px;
        }
        .left-panel::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        .panel-header {
            padding: 0.4rem 1.2rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .panel-header i {
            color: var(--accent);
            font-size: 0.9rem;
        }

        .panel-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem 1.2rem;
            border-radius: 14px;
            font-weight: 500;
            color: var(--text-soft);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .panel-item i {
            width: 1.4rem;
            font-size: 1rem;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .panel-item:hover {
            background: rgba(160, 16, 32, 0.08);
            color: #fff;
        }
        .panel-item.active {
            background: rgba(160, 16, 32, 0.15);
            color: #fff;
            box-shadow: inset 0 0 0 1px rgba(160, 16, 32, 0.2);
        }
        .panel-item.active i {
            color: var(--accent);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 40px;
            min-width: 0;
        }

        .section {
            background: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 2.2rem 2.2rem 2.6rem;
            box-shadow: var(--shadow-heavy);
            transition: all 0.35s ease;
            scroll-margin-top: 24px;
        }
        .section:hover {
            border-color: rgba(160, 16, 32, 0.15);
        }
        .section::before {
            content: '';
            display: block;
            height: 3px;
            width: 60px;
            background: linear-gradient(90deg, var(--accent), transparent);
            border-radius: 10px;
            margin-bottom: 1.4rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 1.8rem;
        }
        .section-header .section-icon {
            color: var(--accent);
            font-size: 1.2rem;
        }

        .hero-content {
            text-align: center;
        }
        .profile-wrapper {
            position: relative;
            display: inline-block;
            width: 140px;
            height: 140px;
            margin-bottom: 1.2rem;
        }
        .profile-border {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--accent-dim), var(--accent), var(--accent-dim), var(--accent), var(--accent-dim));
            animation: spin 12s linear infinite;
            z-index: 0;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .profile-image {
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: var(--bg-deep);
            overflow: hidden;
            border: 2px solid rgba(160, 16, 32, 0.3);
            box-shadow: 0 0 40px rgba(160, 16, 32, 0.15);
        }
        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #profileName {
            font-size: clamp(2.6rem, 6vw, 4.2rem);
            font-weight: 900;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f0f0f0 20%, var(--accent) 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.15rem;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--text-soft);
            font-weight: 400;
            margin-top: 0.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .subtitle i {
            color: var(--accent);
            opacity: 0.7;
        }

        .bio-content {
            max-width: 560px;
            margin: 1.4rem auto 0;
            color: var(--text-soft);
            font-size: 0.95rem;
            line-height: 1.7;
            background: rgba(160, 16, 32, 0.04);
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(160, 16, 32, 0.06);
            display: inline-block;
        }

        .bio-links-section {
            margin-top: 2.8rem;
        }
        .bio-links-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 1.2rem;
        }
        .bio-links-title i {
            color: var(--accent);
        }
        .bio-links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.8rem;
        }

        .server-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-direction: column;
            gap: 0.2rem;
            transition: all 0.25s;
            cursor: pointer;
            backdrop-filter: blur(4px);
            min-height: 80px;
        }
        .server-card:hover {
            background: rgba(160, 16, 32, 0.06);
            border-color: rgba(160, 16, 32, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5);
        }
        .server-info h4 {
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: #f0f0f0;
        }
        .server-info h4 i {
            font-size: 1rem;
        }
        .server-role {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            background: rgba(160, 16, 32, 0.08);
            border: 1px solid transparent;
            color: var(--text-soft);
            display: inline-block;
            margin-top: 0.2rem;
        }
        .server-year {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }

        .staff-category {
            margin-top: 1.8rem;
        }
        .staff-category:first-of-type {
            margin-top: 0;
        }
        .staff-category h3 {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-soft);
            margin-bottom: 1rem;
            letter-spacing: 0.02em;
        }
        .staff-category h3 i {
            color: var(--accent);
            font-size: 1.1rem;
        }
        .staff-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 0.9rem;
        }
        .staff-category:first-child .staff-grid {
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }

        @media (max-width: 920px) {
            .app-container {
                flex-direction: column;
                padding: 16px;
                gap: 20px;
            }
            .left-panel {
                position: relative;
                top: 0;
                flex: none;
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                padding: 0.8rem 1rem;
                gap: 2px;
                max-height: none;
                overflow-y: visible;
                border-radius: 18px;
            }
            .panel-header {
                display: none;
            }
            .panel-item {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
                flex: 0 1 auto;
            }
            .panel-item i {
                width: auto;
                margin-right: 0.2rem;
            }
            .section {
                padding: 1.8rem 1.2rem;
            }
            .staff-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
            .bio-links-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .section {
                padding: 1.4rem 0.8rem;
                border-radius: 20px;
            }
            .profile-wrapper {
                width: 110px;
                height: 110px;
            }
            .server-card {
                min-height: 70px;
                padding: 0.8rem 0.6rem;
            }
            .staff-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.6rem;
            }
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-dim);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
        ::selection {
            background: rgba(160, 16, 32, 0.3);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- ОВЕРЛЕЙ — клик работает по всей области -->
    <div id="bg-start-audio">
        <h1>✦ нажмите в любом месте ✦</h1>
    </div>

    <audio id="bg-music" loop preload="auto">
        <source src="song.mp3" type="audio/mp3">
    </audio>

    <button id="mute-btn"><i class="fa-solid fa-volume-high"></i></button>

    <div class="scroll-progress"><div class="scroll-progress-bar"></div></div>

    <div class="app-container" id="appContainer">
        <aside class="left-panel" id="leftPanel">
            <div class="panel-header"><i class="fa-solid fa-compass"></i> навигация</div>
            <div class="panel-item active" data-section="profileBio"><i class="fa-regular fa-user"></i><span>Биография</span></div>
            <div class="panel-item" data-section="staffExperience"><i class="fa-regular fa-briefcase"></i><span>Опыт</span></div>
        </aside>

        <div class="main-content">
            <section class="section" id="profileBio">
                <div class="section-header"><span class="section-icon"><i class="fa-regular fa-user"></i></span> Биография</div>
                <div class="hero-content">
                    <div class="profile-wrapper">
                        <div class="profile-border"></div>
                        <div class="profile-image" id="profileAvatar">
                            <img src="https://i.ibb.co/cXMGtTgv/avatar.png" alt="avatar">
                        </div>
                    </div>
                    <h1 id="profileName">softmethod</h1>
                    <p class="subtitle"><i class="fa-solid fa-magnifying-glass" style="transform:scaleX(-1);"></i> Cheat Hunter &amp; Pc Checker</p>
                    <div class="bio-content" id="bioDetailsContent">montegs visual dev</div>
                    <div class="bio-links-section">
                        <h3 class="bio-links-title"><i class="fa-regular fa-link"></i> ссылки</h3>
                        <div class="bio-links-grid" id="linksGrid"></div>
                    </div>
                </div>
            </section>

            <section class="section" id="staffExperience">
                <div class="section-header"><span class="section-icon"><i class="fa-regular fa-briefcase"></i></span> Стафф-опыт</div>
                <div id="staffContainer"></div>
            </section>
        </div>
    </div>

    <script>
        (function() {
            // ---------- КОНФИГ ----------
            const CONFIG = {
                profile: {
                    name: "softmethod",
                    avatar: "https://i.ibb.co/cXMGtTgv/avatar.png",
                    subtitle: "Cheat Hunter & Pc Checker",
                    bioContent: 'montegs visual dev',
                },
                links: [
                    { name: "Discord", role: "softmethod", icon: "fa-brands fa-discord", color: "#5865F2", link: "https://discord.com/users/851399526945652796" },
                    { name: "NameMC", role: "montegs", icon: "fa-solid fa-network-wired", color: "#FFFFFF", link: "https://ru.namemc.com/profile/montegs.1" },
                    { name: "GunsLol", role: "softmethod", icon: "fa-solid fa-seedling", color: "#8b0000", link: "https://guns.lol/softmethod" },
                    { name: "YouTube", role: "softmethod", icon: "fa-brands fa-youtube", color: "#FF0000", link: "https://www.youtube.com/@BestKzPots" },
                ],
                staffExperience: {
                    discord: [
                        { serverName: "Revage", role: "DISCORD CURATOR", year: "2023", color: "#DC1E1E" },
                    ],
                    minecraft: [
                        { serverName: "Revage", role: "Curator & HEAD OF SS", year: "2023-2026", color: "#EC5252" },
                        { serverName: "CakeWorld", role: "HEAD ADMIN", year: "2025", color: "#8B0000" },
                        { serverName: "RedBee", role: "Moder & HEAD OF SS", year: "2023", color: "#0000FF" },
                        { serverName: "BeeMC", role: "ADMIN & HEAD OF SS", year: "2024", color: "#EC5252" },
                        { serverName: "EasyMoney", role: "Moder", year: "2023", color: "#0000FF" },
                        { serverName: "ProxWorld (1)", role: "Curator & HEAD OF SS", year: "2025", color: "#EC5252" },
                        { serverName: "ProxWorld (2)", role: "Curator & CHEAT HUNTER", year: "2025", color: "#EC5252" },
                        { serverName: "Cristalix", role: "HELPER", year: "2025", color: "#FFD700" },
                        { serverName: "CookieWorld", role: "ADMIN", year: "2025", color: "#EC5252" },
                        { serverName: "SolarCloud", role: "ADMIN", year: "2025", color: "#EC5252" },
                        { serverName: "PremialClub", role: "OWNER & HEAD OF SS", year: "2024", color: "#8B0000" },
                        { serverName: "PvpCore", role: "OWNER & HEAD OF SS", year: "2024", color: "#8B0000" },
                        { serverName: "HightMine", role: "ADMIN & HEAD OF SS", year: "2025", color: "#EC5252" },
                        { serverName: "HolyWorld", role: "HELPER", year: "2025", color: "#FFD700" },
                        { serverName: "AgeraPvp", role: "HELPER", year: "2025", color: "#FFD700" },
                        { serverName: "CloudyLand", role: "Moder", year: "2022", color: "#0000FF" },
                    ]
                }
            };

            // ---------- HELPER ----------
            function hexToRgba(hex, alpha = 0.12) {
                let c = hex.replace('#', '');
                if (c.length === 3) c = c.split('').map(x => x + x).join('');
                const bigint = parseInt(c, 16);
                const r = (bigint >> 16) & 255, g = (bigint >> 8) & 255, b = bigint & 255;
                return `rgba(${r},${g},${b},${alpha})`;
            }

            // ---------- РЕНДЕР ССЫЛОК ----------
            function renderLinks() {
                const container = document.getElementById('linksGrid');
                container.innerHTML = '';
                CONFIG.links.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'server-card';
                    card.addEventListener('click', () => window.open(item.link, '_blank'));
                    card.innerHTML = `
                        <div class="server-info">
                            <h4>${item.icon ? `<i class="${item.icon}" style="color:${item.color || '#fff'}"></i>` : ''} ${item.name}</h4>
                            <div class="server-role" style="background:${hexToRgba(item.color || '#888', 0.12)}; border-color:${hexToRgba(item.color || '#888', 0.2)}; color:${item.color || '#aaa'};">${item.role}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            // ---------- РЕНДЕР СТАФФА ----------
            function renderStaff() {
                const container = document.getElementById('staffContainer');
                container.innerHTML = '';

                const categories = [
                    { key: 'discord', title: 'Discord', icon: 'fa-brands fa-discord', data: CONFIG.staffExperience.discord },
                    { key: 'minecraft', title: 'Minecraft', icon: 'fa-solid fa-cube', data: CONFIG.staffExperience.minecraft }
                ];

                categories.forEach(cat => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'staff-category';
                    wrapper.innerHTML = `<h3><i class="${cat.icon}"></i> ${cat.title}</h3><div class="staff-grid"></div>`;
                    const grid = wrapper.querySelector('.staff-grid');

                    cat.data.forEach(server => {
                        const card = document.createElement('div');
                        card.className = 'server-card';
                        const yearHtml = server.year ? `<div class="server-year">${server.year}</div>` : '';
                        const roleColor = server.color || '#aaa';
                        card.innerHTML = `
                            <div class="server-info">
                                <h4>${server.serverName}</h4>
                                ${yearHtml}
                                <div class="server-role" style="background:${hexToRgba(roleColor, 0.12)}; border-color:${hexToRgba(roleColor, 0.2)}; color:${roleColor};">${server.role}</div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });

                    container.appendChild(wrapper);
                });
            }

            // ---------- НАВИГАЦИЯ ----------
            function initNav() {
                const items = document.querySelectorAll('.panel-item');
                const sections = document.querySelectorAll('.section');

                items.forEach(item => {
                    item.addEventListener('click', () => {
                        const targetId = item.dataset.section;
                        const target = document.getElementById(targetId);
                        if (target) {
                            const top = target.getBoundingClientRect().top + window.scrollY - 28;
                            window.scrollTo({ top, behavior: 'smooth' });
                        }
                    });
                });

                function highlight() {
                    const scrollY = window.scrollY + 120;
                    let activeId = 'profileBio';
                    sections.forEach(sec => {
                        const rect = sec.getBoundingClientRect();
                        const offset = rect.top + window.scrollY;
                        if (scrollY >= offset - 20) activeId = sec.id;
                    });
                    items.forEach(el => {
                        el.classList.toggle('active', el.dataset.section === activeId);
                    });
                }

                window.addEventListener('scroll', highlight, { passive: true });
                highlight();

                function updateProgress() {
                    const scrollTop = window.scrollY;
                    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
                    const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
                    document.querySelector('.scroll-progress-bar').style.width = progress + '%';
                }
                window.addEventListener('scroll', updateProgress, { passive: true });
                updateProgress();
            }

            // ---------- АУДИО (исправленный клик) ----------
            function initAudio() {
                const overlay = document.getElementById('bg-start-audio');
                const muteBtn = document.getElementById('mute-btn');
                const audio = document.getElementById('bg-music');
                const appContainer = document.getElementById('appContainer');

                audio.volume = 0.075;

                function startApp() {
                    // Скрываем оверлей
                    overlay.classList.add('hidden');
                    // Показываем кнопку mute
                    muteBtn.classList.add('visible');
                    // Загружаем контент
                    appContainer.classList.add('loaded');
                    // Запускаем музыку
                    audio.play().catch(() => {});
                }

                // Клик по оверлею — главный триггер
                overlay.addEventListener('click', startApp, { once: true });

                // Также пробуем autoplay, если браузер разрешает
                audio.play().then(() => {
                    // если autoplay сработал — скрываем оверлей
                    if (!overlay.classList.contains('hidden')) {
                        overlay.classList.add('hidden');
                        muteBtn.classList.add('visible');
                        appContainer.classList.add('loaded');
                    }
                }).catch(() => {});

                // Mute
                muteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    audio.muted = !audio.muted;
                    muteBtn.innerHTML = audio.muted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
                    muteBtn.style.borderColor = audio.muted ? '#555' : 'var(--border-glow)';
                });
            }

            // ---------- GHOST CURSOR (лёгкий) ----------
            function initGhostCursor() {
                const canvas = document.createElement('canvas');
                canvas.style.position = 'fixed';
                canvas.style.top = '0';
                canvas.style.left = '0';
                canvas.style.pointerEvents = 'none';
                canvas.style.zIndex = '99999999';
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                document.body.appendChild(canvas);
                const ctx = canvas.getContext('2d');

                let particles = [];
                const MAX_PARTICLES = 18;

                const img = new Image();
                img.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAAXNSR0IArs4c6QAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAAhGVYSWZNTQAqAAAACAAFARIAAwAAAAEAAQAAARoABQAAAAEAAABKARsABQAAAAEAAABSASgAAwAAAAEAAgAAh2kABAAAAAEAAABaAAAAAAAAAEgAAAABAAAASAAAAAEAA6ABAAMAAAABAAEAAKACAAQAAAABAAAADqADAAQAAAABAAAADgAAAACy01uLAAAACXBIWXMAAAsTAAALEwEAmpwYAAABWWlUWHRYTUw6Y29tLmFkb2JlLnhtcAAAAAAAPHg6eG1wbWV0YSB4bWxuczp4PSJhZG9iZTpuczptZXRhLyIgeDp4bXB0az0iWE1QIENvcmUgNS40LjAiPgogICA8cmRmOlJERiB4bWxuczpyZGY9Imh0dHA6Ly93d3cudzMub3JnLzE5OTkvMDIvMjItcmRmLXN5bnRheC1ucyMiPgogICAgICA8cmRmOkRlc2NyaXB0aW9uIHJkZjphYm91dD0iIgogICAgICAgICAgICB4bWxuczp0aWZmPSJodHRwOi8vbnMuYWRvYmUuY29tL3RpZmYvMS4wLyI+CiAgICAgICAgIDx0aWZmOk9yaWVudGF0aW9uPjE8L3RpZmY6T3JpZW50YXRpb24+CiAgICAgIDwvcmRmOkRlc2NyaXB0aW9uPgogICA8L3JkZjpSREY+CjwveDp4bXBtZXRhPgpMwidZAAABqElEQVQoFY3SPUvDQBgH8BREpRHExYiDgmLFl6WC+AYmWeyLg4i7buJX8DMpOujgyxGvUYeCgzhUQUSKKLUS0+ZyptXh8Z5Ti621ekPyJHl+uftfomhaf9Ei5JyxXKfynyEA6EYcLHpwyflT958GAQ7DTABNHd8EbtDbEH2BD5QEQmi2mM8P/Iq+A0SzszEg+3sPjDnDdVEtQKQbMUidHD3xVzf6A9UDEmEm+8h9KTqTVUjT+vB53aHrCbAPiceYq1dQI1Aqv4EhMll0jzv+Y0yiRgCnLRSYyDQHVoqUXe4uKL9l+L7GXC4vkMhE6eW/AOJs9k583ORDUyXMZ8F5SVHVVnllmPNKyFagAJ5DofaqGXw/gHBYg51dIldkmknY2tguv3jOtHR4+MqAzaraJXbEhqHhcQlwGSOi5pytVQHZLN5s0WNe8HPrLYlFsO20RPHkImxsbmHdLJFI76th7Z4SeuF53hTeFLvhRCJRCTKZKxgdnRDbW+iozFJbBMw14/ElwGYc0egMBMFzT21f5Rog33Z7dX02GBm7WV5ZfT5Nn5bE3zuCDe9UxdTpNvK+5AAAAABJRU5ErkJggg==";

                let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
                let lastTime = 0, interval = 80;

                function addParticle(x, y) {
                    if (particles.length >= MAX_PARTICLES) particles.shift();
                    particles.push({ x, y, life: 1.0, decay: 0.02 + Math.random() * 0.02 });
                }

                function onMove(x, y) {
                    mouseX = x; mouseY = y;
                    const now = Date.now();
                    if (now - lastTime > interval) {
                        addParticle(x, y);
                        lastTime = now;
                    }
                }

                document.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
                document.addEventListener('touchmove', (e) => {
                    if (e.touches.length) onMove(e.touches[0].clientX, e.touches[0].clientY);
                }, { passive: true });

                function draw() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    for (let i = particles.length - 1; i >= 0; i--) {
                        const p = particles[i];
                        p.life -= p.decay;
                        if (p.life <= 0) { particles.splice(i, 1); continue; }
                        const size = 14 * p.life;
                        const alpha = p.life * 0.5;
                        ctx.globalAlpha = alpha;
                        ctx.drawImage(img, p.x - size/2, p.y - size/2, size, size);
                    }
                    ctx.globalAlpha = 1;
                    requestAnimationFrame(draw);
                }
                draw();

                window.addEventListener('resize', () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                });
            }

            // ---------- ЗАПУСК ----------
            document.addEventListener('DOMContentLoaded', () => {
                renderLinks();
                renderStaff();
                initNav();
                initAudio();
                initGhostCursor();
            });
        })();
    </script>
